<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Perencanaan Desa - SIA Batetangnga</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/global-tahun.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .tab-btn.active { background-color: #4f46e5; color: white; border-color: #4f46e5; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- NAVBAR CONTAINER -->
    <div id="navbar-container"></div>

    <!-- MAIN CONTAINER -->
    <div class="container-full">
        
        <!-- HEADER KARTU & FILTER PERENCANAAN -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 my-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-4 mb-4">
                <div>
                    <h2 class="text-xl font-extrabold text-slate-900 tracking-wide uppercase flex items-center gap-2">
                        <i class="fas fa-database text-indigo-600"></i>
                        DATA PERENCANAAN DESA BATETANGNGA
                    </h2>
                    <p class="text-xs text-slate-500 mt-1">Pusat Data Mentah & Laporan Tabel Perencanaan Pembangunan Desa</p>
                </div>

                <!-- FILTER TAHUN & SEARCH BAR -->
                <div class="flex flex-wrap items-center gap-3">
                    <div class="bg-indigo-50 border border-indigo-200 px-3.5 py-1.5 rounded-xl flex items-center gap-2">
                        <i class="fas fa-calendar-alt text-indigo-600 text-xs"></i>
                        <span class="text-xs font-bold text-slate-700">Tahun Aktif:</span>
                        <span class="display-active-tahun font-black text-indigo-700 text-sm">2027</span>
                    </div>

                    <div class="relative min-w-[220px]">
                        <input type="text" id="search-input" onkeyup="filterDataTabel()" placeholder="Cari kegiatan / lokasi..." class="w-full pl-8 pr-3 py-1.5 text-xs border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50 font-medium">
                        <i class="fas fa-search absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
                    </div>

                    <button onclick="loadActiveTabData()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-3.5 py-2 rounded-lg shadow transition flex items-center gap-1.5">
                        <i class="fas fa-sync-alt"></i> Refresh Data
                    </button>
                </div>
            </div>

            <!-- SUB-TAB DATA PERENCANAAN -->
            <div class="flex flex-wrap gap-2 text-xs font-bold">
                <button onclick="switchTab('master')" id="tab-master" class="tab-btn active px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition flex items-center gap-1.5">
                    <i class="fas fa-layer-group"></i> Master RPJMDes
                </button>
                <button onclick="switchTab('rkpdes')" id="tab-rkpdes" class="tab-btn px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition flex items-center gap-1.5">
                    <i class="fas fa-calendar-check"></i> RKPDes
                </button>
                <button onclick="switchTab('durkpdes')" id="tab-durkpdes" class="tab-btn px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition flex items-center gap-1.5">
                    <i class="fas fa-file-signature"></i> DU-RKPDes
                </button>
                <button onclick="switchTab('rab')" id="tab-rab" class="tab-btn px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition flex items-center gap-1.5">
                    <i class="fas fa-file-invoice-dollar"></i> RAB Kegiatan
                </button>
                <button onclick="switchTab('stunting')" id="tab-stunting" class="tab-btn px-4 py-2 rounded-xl border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 transition flex items-center gap-1.5">
                    <i class="fas fa-heartbeat"></i> Stunting
                </button>
            </div>
        </div>

        <!-- CONTAINER TABLE DATA -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 id="tab-title" class="text-sm font-extrabold text-slate-900 uppercase tracking-wide flex items-center gap-2">
                    <i class="fas fa-table text-indigo-600"></i> Tabel Data Master RPJMDes
                </h3>
                <span id="data-count-badge" class="text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-1 rounded-lg">
                    Total: 0 Data
                </span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left border-collapse border border-slate-300">
                    <thead id="data-thead">
                        <!-- Populated dynamically via JS -->
                    </thead>
                    <tbody id="data-tbody">
                        <!-- Populated dynamically via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPT LOADER -->
    <script>
        fetch('/components/navbar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            });
    </script>
    <script src="/data-perencanaan.js"></script>
</body>
</html>
