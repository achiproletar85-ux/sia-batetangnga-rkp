<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriks SDGs Desa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/global-tahun.js"></script>
    <style>
@media print {
    /* Sembunyikan elemen kontrol dan kolom aksi mutlak */
    .no-print, .kolom-aksi, header, sidebar, nav, button, #kontrol-dokumen-container {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        visibility: hidden !important;
    }
    
    body {
        background: white !important;
        font-family: 'Times New Roman', Times, serif !important;
        color: black !important;
    }

    #livePreviewContainer, #sdgsContainer {
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
    }

    table {
        width: 100% !important;
        border-collapse: collapse !important;
        font-size: 9pt !important;
    }

    th, td {
        border: 1px solid black !important;
        padding: 4px 6px !important;
    }

    @page {
        size: A4 landscape;
        margin: 10mm;
    }
}
</style>
</head>
<body class="bg-slate-100">
    <div id="navbar-container" class="no-print print:hidden"></div>
    <div class="container mx-auto p-4">
        <div class="bg-white p-4 rounded-lg shadow-md mb-4">
            <div class="flex justify-between items-center mb-2">
                <h1 class="text-xl font-bold">Kontrol Dokumen</h1>
                <div class="flex items-center gap-2">
                    <button onclick="bukaModalTarikData()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1 shadow-sm no-print">📥 Tarik Program Urgen</button>
                    <button id="print-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                        Cetak
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label for="tgl-cetak" class="block text-sm font-medium text-slate-700">Tanggal Cetak:</label>
                    <input type="date" id="tgl-cetak" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="tim-penyusun" class="block text-sm font-medium text-slate-700">Ketua Tim Penyusun:</label>
                    <select id="tim-penyusun" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
                        <option>ABDUL AZIS, S. Pd</option>
                        <option>NAMA LAIN 1</option>
                        <option>NAMA LAIN 2</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700">Tahun Target SDGs:</label>
                    <div class="bg-indigo-50 border border-indigo-200 px-3.5 py-1.5 rounded-xl flex items-center gap-2 mt-1">
                        <i class="fas fa-calendar-alt text-indigo-600 text-sm"></i>
                        <span class="text-xs font-bold text-slate-700">Tahun Aktif:</span>
                        <span class="display-active-tahun font-black text-indigo-700 text-sm">2027</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="sdgsContainer" class="overflow-x-auto">
            <!-- Konten tabel dinamis akan dimuat di sini -->
            <div class="text-center py-10">
                <p class="text-slate-500">Memuat data...</p>
            </div>
        </div>
    </div>

    <script src="sdgs.js?v=20260806-2"></script>

    <div id="modalTarikData" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 font-sans no-print">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl p-6 text-slate-800 border border-slate-200">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h3 class="font-bold text-base text-slate-900 flex items-center gap-2">
                📥 Tarik Program Urgen dari Tahun Lain
            </h3>
            <button onclick="tutupModalTarikData()" class="text-slate-400 hover:text-slate-600 font-bold text-xl">&times;</button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4 text-xs">
            <div>
                <label class="block font-bold text-slate-700 mb-1">Pilih Tahun Asal Program:</label>
                <select id="select-tahun-asal" onchange="loadUsulanTahunAsal()" class="w-full border rounded px-2.5 py-1.5 font-bold text-indigo-700">
                    <option value="2022">2022</option>
                    <option value="2023">2023</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026">2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">Tahun 2028</option>
                    <option value="2029">Tahun 2029</option>
                    <option value="2030">Tahun 2030</option>
                </select>
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-1">Mode Pergeseran Data:</label>
                <div class="flex items-center gap-4 mt-2">
                    <label class="flex items-center gap-1 cursor-pointer font-semibold">
                        <input type="radio" name="modePergeseran" value="salin" checked class="text-indigo-600">
                        <span>📋 Salin (Duplikasi)</span>
                    </label>
                    <label class="flex items-center gap-1 cursor-pointer font-semibold text-amber-700">
                        <input type="radio" name="modePergeseran" value="pindah" class="text-amber-600">
                        <span>🚚 Pindah Tahun</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="mb-2 flex justify-between items-center text-xs">
            <span class="font-bold text-slate-700">Pilih Kegiatan yang Ingin Ditarik:</span>
            <span class="text-slate-500 italic text-[11px]">*Ceklis program yang urgen</span>
        </div>

        <div id="container-daftar-asal" class="max-h-64 overflow-y-auto border rounded-lg p-2 mb-4 text-xs space-y-2 bg-slate-50">
            <!-- Daftar kegiatan di-load otomatis via JS -->
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t">
            <button onclick="tutupModalTarikData()" class="px-4 py-1.5 bg-slate-200 text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-300">Batal</button>
            <button onclick="eksekusiTarikData()" class="px-4 py-1.5 bg-amber-600 text-white rounded-lg text-xs font-bold hover:bg-amber-700 shadow-sm">📥 Tarik ke Tahun Aktif</button>
        </div>
    </div>
</div>
    <script>
        fetch('/components/navbar.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            })
            .catch(err => console.error('Navbar error:', err));
    </script>
</body>
</html>
